services:
  - type: web
    name: fullstack-prueba-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: fullstack-prueba-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: fullstack-prueba-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://fullstack-prueba-backend.onrender.com

databases:
  - name: fullstack-prueba-db
    plan: free
    databaseName: fullstack_prueba
    user: admin
